# Облачный брокер: TLS 8883 (образ eclipse-mosquitto:2). Шлюз подключается через прокси wan-link.
listener 8883
cafile /certs/ca.crt
certfile /certs/broker.crt
keyfile /certs/broker.key
allow_anonymous true
persistence false

# счётчики брокера ($SYS) раз в секунду - по ним collector считает нагрузку на брокер при backfill
sys_interval 1

# с запасом, чтобы брокер не терял сообщения при пике backfill
max_queued_messages 100000
max_inflight_messages 200

log_type error
log_type warning
